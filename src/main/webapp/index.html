<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.wrapper{
    width:420px;
    background:#ffffff;
    border-radius:10px;
    padding:30px 40px;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
    color:#333;
}

.wrapper h1{
    font-size:36px;
    text-align:center;
    color:#333;
    margin-bottom:20px;
}

.input-box{
    width:100%;
    height:50px;
    margin:20px 0;
}

.input-box input{
    width:100%;
    height:100%;
    border:1px solid #ccc;
    border-radius:40px;
    font-size:16px;
    color:#333;
    padding:0 20px;
    outline:none;
}

.input-box input::placeholder{
    color:#777;
}

.remember-forgot{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    margin:15px 0;
}

.remember-forgot a{
    color:#007bff;
    text-decoration:none;
}

.remember-forgot a:hover{
    text-decoration:underline;
}

.btn{
    width:100%;
    height:45px;
    background:#007bff;
    border:none;
    border-radius:40px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    background:#0056b3;
}

.register-link{
    text-align:center;
    margin-top:20px;
}

.register-link a{
    color:#007bff;
    text-decoration:none;
    font-weight:bold;
}

.register-link a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="wrapper">
    <form>
        <h1>Login</h1>

        <div class="input-box">
            <input type="text" placeholder="Username" required>
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password" required>
        </div>

        <div class="remember-forgot">
            <label>
                <input type="checkbox"> Remember Me
            </label>

            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn">Login</button>

        <div class="register-link">
            <p>Don't have an account? <a href="#">Register</a></p>
        </div>
    </form>
</div>

</body>
</html>
