<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
<div class="container">
 
    <h1>🎉 Happy Birthday 🎉</h1>
 
    <div class="balloons">
        <div class="balloon red"></div>
        <div class="balloon blue"></div>
        <div class="balloon green"></div>
        <div class="balloon yellow"></div>
    </div>
 
    <div class="cake">
        <div class="candles">
            <div class="candle"><span class="flame"></span></div>
            <div class="candle"><span class="flame"></span></div>
            <div class="candle"><span class="flame"></span></div>
        </div>
 
        <div class="cake-top"></div>
        <div class="cake-base"></div>
    </div>
 
    <p class="message">
        Wishing You Joy, Happiness,
        Success and Wonderful Memories!
    </p>
 
</div>
 
<div class="fireworks"></div>
 
</body>
</html>
